name: Build Roman Research Nexus

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository that published the Roman Notebooks release
        required: true
        type: string
      roman_notebooks_ref:
        description: Roman Notebooks tag to build from
        required: true
        type: string
      roman_notebooks_version:
        description: Roman Notebooks release or test version
        required: true
        type: string
      roman_notebooks_release_channel:
        description: Image publication channel
        required: true
        default: release
        type: choice
        options:
          - release
          - test
      roman_notebooks_delivery_mode_recommendation:
        description: Advisory delivery mode from the Roman Notebooks release workflow
        required: false
        default: image
        type: choice
        options:
          - image
          - spec
      roman_notebooks_calver:
        description: Roman Notebooks CalVer release, used only for release images
        required: false
        type: string
      roman_notebooks_sha:
        description: Commit SHA for the Roman Notebooks release
        required: true
        type: string
      roman_notebooks_release_url:
        description: GitHub Release URL
        required: true
        type: string

concurrency:
  group: roman-research-nexus-${{ inputs.roman_notebooks_release_channel }}-${{ inputs.roman_notebooks_version }}
  cancel-in-progress: false

jobs:
  build:
    name: Roman Research Nexus ${{ inputs.roman_notebooks_version }}
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release inputs
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          ROMAN_NOTEBOOKS_REF: ${{ inputs.roman_notebooks_ref }}
          ROMAN_NOTEBOOKS_VERSION: ${{ inputs.roman_notebooks_version }}
          ROMAN_NOTEBOOKS_RELEASE_CHANNEL: ${{ inputs.roman_notebooks_release_channel }}
          ROMAN_NOTEBOOKS_DELIVERY_MODE_RECOMMENDATION: ${{ inputs.roman_notebooks_delivery_mode_recommendation }}
          ROMAN_NOTEBOOKS_CALVER: ${{ inputs.roman_notebooks_calver }}
          ROMAN_NOTEBOOKS_SHA: ${{ inputs.roman_notebooks_sha }}
        run: |
          set -euo pipefail

          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$ROMAN_NOTEBOOKS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$ROMAN_NOTEBOOKS_DELIVERY_MODE_RECOMMENDATION" =~ ^(image|spec)$ ]]

          case "$ROMAN_NOTEBOOKS_RELEASE_CHANNEL" in
            release)
              [[ "$ROMAN_NOTEBOOKS_VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]
              [[ "$ROMAN_NOTEBOOKS_REF" == "$ROMAN_NOTEBOOKS_VERSION" ]]
              [[ "$ROMAN_NOTEBOOKS_DELIVERY_MODE_RECOMMENDATION" == "image" ]]
              if [[ -n "$ROMAN_NOTEBOOKS_CALVER" ]]; then
                [[ "$ROMAN_NOTEBOOKS_CALVER" == "$ROMAN_NOTEBOOKS_VERSION" ]]
              fi
              ;;
            test)
              [[ "$ROMAN_NOTEBOOKS_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
              [[ "$ROMAN_NOTEBOOKS_REF" == "$ROMAN_NOTEBOOKS_VERSION" ]]
              ;;
            *)
              echo "Unsupported release channel: $ROMAN_NOTEBOOKS_RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac

      - name: Verify Roman Notebooks release tag
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          ROMAN_NOTEBOOKS_REF: ${{ inputs.roman_notebooks_ref }}
          ROMAN_NOTEBOOKS_SHA: ${{ inputs.roman_notebooks_sha }}
        run: |
          set -euo pipefail

          remote="https://github.com/${SOURCE_REPOSITORY}.git"
          tag_sha="$(git ls-remote --tags "$remote" "refs/tags/${ROMAN_NOTEBOOKS_REF}" | awk '{print $1}')"

          if [[ -z "$tag_sha" ]]; then
            echo "Tag ${ROMAN_NOTEBOOKS_REF} was not found in ${SOURCE_REPOSITORY}." >&2
            exit 1
          fi

          if [[ "$tag_sha" != "$ROMAN_NOTEBOOKS_SHA" ]]; then
            echo "Tag ${ROMAN_NOTEBOOKS_REF} does not point to ${ROMAN_NOTEBOOKS_SHA}." >&2
            echo "Resolved tag SHA: $tag_sha" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure build environment
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt

      - name: Update Roman wrangler spec
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          ROMAN_NOTEBOOKS_REF: ${{ inputs.roman_notebooks_ref }}
          ROMAN_NOTEBOOKS_VERSION: ${{ inputs.roman_notebooks_version }}
          ROMAN_NOTEBOOKS_RELEASE_CHANNEL: ${{ inputs.roman_notebooks_release_channel }}
          ROMAN_NOTEBOOKS_DELIVERY_MODE_RECOMMENDATION: ${{ inputs.roman_notebooks_delivery_mode_recommendation }}
          ROMAN_NOTEBOOKS_SHA: ${{ inputs.roman_notebooks_sha }}
          ROMAN_NOTEBOOKS_RELEASE_URL: ${{ inputs.roman_notebooks_release_url }}
        run: |
          set -euo pipefail

          cat > /tmp/update_roman_spec.py <<'PY'
          import os
          from pathlib import Path

          import yaml

          spec_path = Path("deployments/roman/environments/nbw-wrangler-spec.yaml")
          spec = yaml.safe_load(spec_path.read_text())

          version = os.environ["ROMAN_NOTEBOOKS_VERSION"]
          channel = os.environ["ROMAN_NOTEBOOKS_RELEASE_CHANNEL"]
          delivery_mode = os.environ["ROMAN_NOTEBOOKS_DELIVERY_MODE_RECOMMENDATION"]
          source_repository = os.environ["SOURCE_REPOSITORY"]

          spec["repositories"]["roman_notebooks"]["url"] = (
              f"https://github.com/{source_repository}.git"
          )
          spec["repositories"]["roman_notebooks"]["ref"] = os.environ["ROMAN_NOTEBOOKS_REF"]
          spec["system"]["primary_repo"] = source_repository

          header = spec["image_spec_header"]
          if channel == "release":
              header["image_name"] = f"RomanNexus-{version}"
              header["kernel_name"] = f"RomanNexus-{version}"
              header["display_name"] = f"Roman Research Nexus {version}"
          else:
              header["image_name"] = f"RomanNexus-test-{version}"
              header["kernel_name"] = f"RomanNexus-test-{version}"
              header["display_name"] = f"Roman Research Nexus {version} test"

          spec.setdefault("release", {})
          spec["release"]["roman_notebooks_version"] = version
          spec["release"]["roman_notebooks_channel"] = channel
          spec["release"]["delivery_mode_recommendation"] = delivery_mode
          if channel == "release":
              spec["release"]["roman_notebooks_calver"] = version
          spec["release"]["roman_notebooks_sha"] = os.environ["ROMAN_NOTEBOOKS_SHA"]
          spec["release"]["roman_notebooks_release_url"] = os.environ[
              "ROMAN_NOTEBOOKS_RELEASE_URL"
          ]

          spec_path.write_text(yaml.safe_dump(spec, sort_keys=False))
          PY
          python /tmp/update_roman_spec.py

          git diff -- deployments/roman/environments/nbw-wrangler-spec.yaml

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo apt clean
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile
          sudo chmod 0600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          cat /proc/meminfo
          df -h

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          scripts/image-configure roman --use-frozen 0 --freeze 1 --owner quay.io/jupyter
          source setup-env
          scripts/image-build

      - name: Test image
        shell: bash
        run: |
          set -euo pipefail
          source setup-env
          scripts/image-test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        shell: bash
        env:
          GHCR_IMAGE: ghcr.io/spacetelescope/science-platform-images/roman-research-nexus
          ROMAN_NOTEBOOKS_VERSION: ${{ inputs.roman_notebooks_version }}
          ROMAN_NOTEBOOKS_RELEASE_CHANNEL: ${{ inputs.roman_notebooks_release_channel }}
          ROMAN_NOTEBOOKS_SHA: ${{ inputs.roman_notebooks_sha }}
        run: |
          set -euo pipefail

          source setup-env
          short_sha="${ROMAN_NOTEBOOKS_SHA:0:7}"

          if [[ "$ROMAN_NOTEBOOKS_RELEASE_CHANNEL" == "release" ]]; then
            tags=(latest "$ROMAN_NOTEBOOKS_VERSION" "sha-${short_sha}")
          else
            tags=(test "test-${ROMAN_NOTEBOOKS_VERSION}" "test-sha-${short_sha}")
          fi

          for tag in "${tags[@]}"; do
            docker tag "$NOTEBOOK_ID" "${GHCR_IMAGE}:${tag}"
            docker push "${GHCR_IMAGE}:${tag}"
          done

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Roman Research Nexus image"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Channel | ${{ inputs.roman_notebooks_release_channel }} |"
            echo "| Delivery mode recommendation | ${{ inputs.roman_notebooks_delivery_mode_recommendation }} |"
            echo "| Roman Notebooks version | ${{ inputs.roman_notebooks_version }} |"
            echo "| Roman Notebooks SHA | ${{ inputs.roman_notebooks_sha }} |"
            echo "| Release URL | ${{ inputs.roman_notebooks_release_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
